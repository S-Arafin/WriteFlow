name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Code Validation & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        # DATABASE_URL falls back to a dummy value in prisma.config.ts when not set,
        # so the client type generation succeeds in CI without a real database.
        # The real DATABASE_URL secret is only required for migration/seed steps.
        run: npx prisma generate

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Execute Linter
        run: npm run lint

      - name: Validate Database Schema
        run: npx prisma validate
